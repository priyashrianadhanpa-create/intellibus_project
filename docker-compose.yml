services:
  # 1. PostGIS Production Spatial Database
  db:
    image: postgis/postgis:15-3.3
    container_name: intellibus_db
    restart: always
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=ptsye9wBds3lrRPrj_eRsQ
      - POSTGRES_DB=intellibus
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d intellibus"]
      interval: 5s
      timeout: 5s
      retries: 8

  # 2. IoT Telemetry Hardware MQTT Broker
  mqtt:
    image: eclipse-mosquitto:2
    container_name: intellibus_mqtt
    restart: always
    ports:
      - "1883:1883"
    command: mosquitto -c /mosquitto-no-auth.conf

  # 3. FastAPI High-Concurrency ASGI Backend (4 Workers)
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: intellibus_backend
    restart: always
    environment:
      - PROJECT_NAME=IntelliBus AI Platform
      - ENVIRONMENT=production
      - API_V1_STR=/api/v1
      - SECRET_KEY=7eddf14a6aa65ea84c389c4db02d2ce6fdce18e98a6a4b57fb4c00ec1870974d
      - DATABASE_URL=postgresql+psycopg2://postgres:ptsye9wBds3lrRPrj_eRsQ@db:5432/intellibus
      - MQTT_BROKER_HOST=mqtt
      - MQTT_BROKER_PORT=1883
      - CORS_ORIGINS=["*"]
      - WORKERS=4
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
      mqtt:
        condition: service_started

  # 4. Vite React Production Web App (Nginx Reverse Proxy & Gzip)
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: intellibus_frontend
    restart: always
    ports:
      - "80:80"
    depends_on:
      - backend

volumes:
  pgdata:
